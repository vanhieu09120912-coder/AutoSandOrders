
name: Build AutoSandOrders

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build mod
        run: chmod +x ./gradlew && ./gradlew build

      - uses: actions/upload-artifact@v4
        with:
          name: AutoSandOrders-JAR
          path: build/libs/*.jar
          
